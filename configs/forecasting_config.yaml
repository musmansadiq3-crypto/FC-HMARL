# ============================================================
# FC-HMARL FORECASTING CONFIGURATION
# ============================================================
#
# Source:
# Manuscript Table 3 - Forecasting Model Configuration
#
# Forecasted variables:
#   1. PV generation
#   2. Load demand
#   3. EV charging demand
#   4. Electricity market price
# ============================================================


# ------------------------------------------------------------
# FORECASTING WINDOW
# ------------------------------------------------------------

forecasting:

  historical_input_window_hours: 168

  forecast_horizon_hours: 24

  time_resolution_hours: 1


# ------------------------------------------------------------
# FORECASTED VARIABLES
# ------------------------------------------------------------

  variables:

    - pv_generation

    - load_demand

    - ev_charging_demand

    - electricity_price


# ------------------------------------------------------------
# DATA SPLIT
# ------------------------------------------------------------

data_split:

  training_ratio: 0.70

  validation_ratio: 0.15

  testing_ratio: 0.15


# ------------------------------------------------------------
# PREPROCESSING
# ------------------------------------------------------------

preprocessing:

  missing_data_method: "linear_interpolation"

  normalization_method: "min_max_scaling"

  remove_abnormal_samples: true

  abnormal_sample_method: "three_sigma"


# ------------------------------------------------------------
# UNCERTAINTY QUANTIFICATION
# ------------------------------------------------------------

uncertainty:

  confidence_level: 0.95

  confidence_interval_percent: 95


# ------------------------------------------------------------
# MODEL OUTPUT
# ------------------------------------------------------------

output:

  prediction_horizon: 24

  return_prediction: true

  return_forecast_error: true

  return_uncertainty: true

  return_confidence_coefficient: true
# ============================================================
# FORECASTING MODEL ARCHITECTURE
# ============================================================
#
# IMPORTANT:
# The manuscript permits transformer / attention-based temporal
# architectures but does not report the exact layer dimensions.
#
# Therefore the values below are RECONSTRUCTION CHOICES.
# ============================================================

model:

  architecture: "transformer_encoder"

  source: "reconstruction_choice"

  input_window: 168

  forecast_horizon: 24

  number_of_input_features: 4

  number_of_target_features: 4

  hidden_dimension: 128

  number_of_attention_heads: 4

  number_of_encoder_layers: 2

  feedforward_dimension: 256

  dropout: 0.10

  activation: "gelu"

  output_activation: "none"

  use_learnable_positional_encoding: true
# ============================================================
# FORECASTING TRAINING CONFIGURATION
# ============================================================
#
# RECONSTRUCTION CHOICES:
# The manuscript does not separately report the optimizer,
# epoch count, patience, gradient clipping, or scheduler used
# to train the forecasting neural network.
# ============================================================

training:

  optimizer: "adam"

  learning_rate: 0.0001

  weight_decay: 0.00001

  batch_size: 64

  maximum_epochs: 100

  early_stopping_patience: 15

  minimum_improvement: 0.000001

  gradient_clip_norm: 1.0

  scheduler: "reduce_on_plateau"

  scheduler_factor: 0.5

  scheduler_patience: 5

  minimum_learning_rate: 0.000001

  loss_function: "mse"

  random_seed: 42

  device: "auto"

  checkpoint_directory: "outputs/checkpoints"

  checkpoint_filename: "best_forecasting_model.pt"