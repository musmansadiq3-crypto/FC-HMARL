# ============================================================
# FC-HMARL TRAINING CONFIGURATION
# ============================================================
#
# Source:
# Manuscript Table 4 - FC-HMARL Training Hyperparameters
#
# Architecture:
#   5 local microgrid agents
#   1 global VPP coordinator
# ============================================================


# ------------------------------------------------------------
# HIERARCHICAL AGENT STRUCTURE
# ------------------------------------------------------------

agents:

  total_agents: 6

  num_local_agents: 5

  num_global_coordinator_agents: 1


# ------------------------------------------------------------
# TRAINING
# ------------------------------------------------------------

training:

  maximum_training_episodes: 5000

  episode_length_hours: 24

  time_steps_per_episode: 24


# ------------------------------------------------------------
# REINFORCEMENT LEARNING PARAMETERS
# ------------------------------------------------------------

reinforcement_learning:

  algorithm: "SAC"

  discount_factor_gamma: 0.99

  learning_rate: 0.0001

  replay_buffer_size: 1000000

  mini_batch_size: 512

  soft_update_coefficient_tau: 0.005

  optimizer: "Adam"


# ------------------------------------------------------------
# EXPLORATION
# ------------------------------------------------------------

exploration:

  initial_exploration_noise: 0.20

  noise_decay_factor: 0.999


# ------------------------------------------------------------
# CONVERGENCE
# ------------------------------------------------------------

convergence:

  moving_average_window_episodes: 200

  reward_variation_threshold_percent: 1.0

  stop_when_converged: true


# ------------------------------------------------------------
# HIERARCHICAL CONTROL
# ------------------------------------------------------------

hierarchical_control:

  local_agent_role:
    - battery_management
    - ev_charging_coordination
    - energy_sharing_participation

  coordinator_role:
    - global_energy_sharing
    - market_bidding
    - reserve_allocation
    - system_level_coordination


# ------------------------------------------------------------
# CHECKPOINTS
# ------------------------------------------------------------

checkpoint:

  save_enabled: true

  save_best_model: true

  checkpoint_directory: "outputs/checkpoints"


# ------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------

logging:

  enabled: true

  log_directory: "outputs/logs"

  save_episode_reward: true

  save_actor_loss: true

  save_critic_loss: true

  save_policy_entropy: true